# /etc/nginx/sites-available/wow.koj.dev  →  ln -s dans sites-enabled, puis : certbot --nginx -d wow.koj.dev
server {
    listen 80;
    listen [::]:80;
    server_name wow.koj.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wow.koj.dev;

    # Certbot remplit ces lignes (ou colle les tiennes)
    ssl_certificate     /etc/letsencrypt/live/wow.koj.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wow.koj.dev/privkey.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
    }
}
