# Bloc HTTP de départ : copier dans /etc/nginx/sites-available/, activer, puis laisser certbot ajouter le HTTPS :
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d wow.koj.dev --redirect
# Certbot réécrit ce fichier avec le bloc 443 et la redirection.
server {
    listen 80;
    listen [::]:80;
    server_name wow.koj.dev;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
    }
}
