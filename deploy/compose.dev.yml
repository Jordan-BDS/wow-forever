# Développement local : seulement PostgreSQL.
#   docker compose -f deploy/compose.dev.yml up -d
# puis DATABASE_URL=postgres://wow:wow@localhost:5432/wow côté Django.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wow
      POSTGRES_USER: wow
      POSTGRES_PASSWORD: wow
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data

volumes:
  pgdata_dev:
