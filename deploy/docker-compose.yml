# Production sur le VPS : `docker compose up -d --build` depuis ce dossier, avec un fichier .env à côté.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wow}
      POSTGRES_USER: ${POSTGRES_USER:-wow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: ../backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-wow}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-wow}
    volumes:
      - static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  bot:
    build: ../backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-wow}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-wow}
    # Pas de migrations ici : le service web s'en charge au démarrage.
    entrypoint: ["python", "manage.py", "runbot"]
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started

  caddy:
    build:
      context: ..
      dockerfile: deploy/Caddy.Dockerfile
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN manquant}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - static:/srv/static:ro
    depends_on:
      - web

volumes:
  pgdata:
  static:
  caddy_data:
  caddy_config:
