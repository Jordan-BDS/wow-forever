name: Compagnon — release

# Un tag `companion-vX.Y.Z` construit l'exécutable Windows et l'application macOS, signe les artefacts de mise à
# jour Tauri, joint l'addon seul en zip, et publie une release GitHub que le site et le compagnon consultent.
on:
  push:
    tags: ["companion-v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: companion/app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: companion -> target
      - run: npm ci
        working-directory: companion/app
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: companion/app
          tagName: ${{ github.ref_name }}
          releaseName: "Compagnon ${{ github.ref_name }}"
          releaseBody: "Compagnon WoW Forever Guilde (Windows et macOS) et addon seul en zip."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  addon-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip de l'addon seul (secours sans compagnon)
        run: |
          VERSION="${GITHUB_REF_NAME#companion-v}"
          cd addon && zip -r "../WoWForeverGuilde-addon-${VERSION}.zip" WoWForeverGuilde -x "*/README.md"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: WoWForeverGuilde-addon-*.zip
